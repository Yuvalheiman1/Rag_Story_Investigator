services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # Only NEO4J_AUTH is valid for Neo4j server config
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/password}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  app:
    build: .
    depends_on:
      - neo4j
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      # Inside Docker, connect to the neo4j service name (not localhost)
      # Override NEO4J_URI to use the docker network service name
      - NEO4J_URI=bolt://neo4j:7687
    volumes:
      # Persist caches across runs
      - ./cache:/app/cache
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro

volumes:
  neo4j_data:
  neo4j_logs:
