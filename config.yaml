default_rag_system: naive
story:
  path: data/story.xml
  cache_dir: cache
naive:
  chunker:
    max_chunk_size: 1000
    overlap: 50
  embedding:
    model: all-mpnet-base-v2
    output_dimensionality: 768
    device: null
  indexer:
    cache_name: story_naive
    force_reindex: false
  similarity:
    default_threshold: 0.4
graphrag:
  enabled: false
lightrag:
  enabled: true
  working_dir: cache/lightrag
  llm:
    provider: ollama
    model: gemma3:1b
    api_url: http://localhost:11434/api/generate
    max_tokens: 4000
    host: null
    timeout: 300
  embedding:
    provider: local
    batch_size: 32
  query:
    mode: naive
    only_need_context: true
prompt_builder:
  max_length: 3000
  system_instructions: null
llm:
  model: gpt-5-nano
  fallback_model: gpt-4o-mini
  enable_fallback: true
  temperature: 1.0
  max_tokens: 4096
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
