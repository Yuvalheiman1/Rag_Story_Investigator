default_rag_system: naive
story:
  path: data/story.xml
  cache_dir: cache
naive:
  chunker:
    max_chunk_size: 1000
    overlap: 50
  embedding:
    model: all-mpnet-base-v2
    output_dimensionality: 768
    device: null
  indexer:
    cache_name: story_naive
    force_reindex: false
  similarity:
    default_threshold: 0.4
graphrag:
  enabled: false
lightrag:
  enabled: true
  working_dir: cache/lightrag
  index:
    force_reindex: false
  llm:
    provider: openai
    model: gpt-4o-mini
  embedding:
    provider: openai
    batch_size: 32
  query:
    mode: naive
    only_need_context: false
    user_prompt: |
      Format your response in this specific structure:
      1. Start with a concise, direct answer (1-2 sentences), 10-20 words.
      2. Then provide an "Evidence" section with relevant message quotes
      
      For the Evidence section, format each entry as:
      (at timestamp) sender to receiver: message content
      
      Example format:
      (at 2025-08-29T19:15:50+10:00) zoe to six: I just found Liam's phone in Marcus's jacket pocket. What is going on?
      
      Keep your answer brief and fact-based. List the most relevant evidence items with their scores and timestamps.
prompt_builder:
  max_length: 3000
  system_instructions: null
llm:
  model: gpt-5-nano
  fallback_model: gpt-4o-mini
  enable_fallback: true
  temperature: 1.0
  max_tokens: 4096
logging:
  level: DEBUG
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
