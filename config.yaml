# RAG Story Investigator Configuration

# Default RAG system to use (naive, lightrag, graphrag)
default_rag_system: naive

# Story configuration
story:
  path: data/story.xml
  cache_dir: cache

# Naive RAG configuration
naive:
  chunker:
    max_chunk_size: 1000
    overlap: 50
  
  embedding:
    model: all-mpnet-base-v2  # Local sentence-transformers model (768D)
    output_dimensionality: 768
    device: null  # null = auto-detect (cuda/cpu)
  
  indexer:
    cache_name: story_naive
    force_reindex: false
  
  similarity:
    default_threshold: 0.4  # Lower threshold for sentence-transformers (better recall)
    # default_max_results: 5

# LightRAG configuration
lightrag:
  working_dir: cache/lightrag
  mode: hybrid  # naive, local, global, hybrid
  force_reindex: false
  
  embedding:
    model: all-mpnet-base-v2  # Local sentence-transformers model (768D)
    output_dimensionality: 768
    device: null  # null = auto-detect (cuda/cpu)

# GraphRAG configuration
graphrag:
  # TODO: Add GraphRAG-specific settings
  enabled: false

# Prompt builder configuration
prompt_builder:
  max_length: 4000
  system_instructions: null  # null = use default

# LLM configuration
llm:
  model: gemini-1.5-flash
  fallback_model: gpt-5-nano  # Fallback: OpenAI when Gemini fails (cheapest GPT-5)
  enable_fallback: true  # Auto-fallback on errors
  temperature: 0.7
  max_tokens: 1024


# Logging configuration
logging:
  level: DEBUG  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# API Keys (use environment variables)
# Set these in your .env file:
#   GEMINI_API_KEY=your_key_here
#   OPENAI_API_KEY=your_key_here
